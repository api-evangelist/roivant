description: 'Roivant Sciences Ltd. (Nasdaq: ROIV) is a commercial-stage biopharmaceutical
  holding company that accelerates the development and commercialization of medicines
  through its distinctive "Vant" model, a network of nimble, focused subsidiary companies
  such as Immunovant, Priovant, and Pulmovant. Founded in 2014, Roivant advances a
  pipeline spanning immunology, dermatology, and other therapeutic areas, and has delivered
  multiple FDA approvals and Phase 3 trial successes. Roivant is a company profile in
  the API Evangelist network; it operates a corporate and investor web presence but
  publishes no public developer API surface.'
